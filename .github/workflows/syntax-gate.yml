name: Syntax gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        run: python3 scripts/check-inline-js.py

# Recheck against main after reservar.html syntax hotfix.
