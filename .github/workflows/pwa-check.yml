name: Synapse PWA static gate

on:
  push:
    branches:
      - 'feature/synapse-pwa-installable-v1-20261020'
  pull_request:
    paths:
      - 'index.html'
      - 'reservar.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/check-pwa.cjs'
      - 'scripts/check-pwa-session.cjs'
      - 'scripts/test-pwa-session-runtime.cjs'
      - 'scripts/check-reservar-access-contract.cjs'
      - 'scripts/build-pwa-icons.py'
      - 'icons/**'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-pwa-gate:
    name: Validate admin PWA boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate PNG icon assets for validation
        run: |
          python3 -m pip install --user cairosvg
          python3 scripts/build-pwa-icons.py
      - name: Preserve generated install icons
        uses: actions/upload-artifact@v4
        with:
          name: synapse-pwa-icons
          path: |
            icons/synapse-192.png
            icons/synapse-512.png
          if-no-files-found: error
          retention-days: 14
      - name: Run static PWA gate
        run: |
          node scripts/check-pwa.cjs
          node scripts/check-pwa-session.cjs
          node scripts/test-pwa-session-runtime.cjs
          node scripts/check-reservar-access-contract.cjs
      - name: Verify release remains blocked without security evidence
        run: |
          if node scripts/check-pwa.cjs --release; then
            echo "ERROR: release gate passed without verified backend and booking evidence"
            exit 1
          fi
          echo "PASS: release gate refuses an unverified publication"
# This workflow does not deploy, publish, or modify Firebase.
